[unstable]
bindeps = true
feature-unification = true

[resolver]
feature-unification = "package"

[target.'cfg(target_os = "none")']
runner = "cargo run -p minecraft-os --bin qemu-integration-test-runner --"

[alias]
test-integration = "test -p tests-integration --target x86_64-minecraft-os.json -Zjson-target-spec -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem"
