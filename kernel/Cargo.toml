cargo-features = ["per-package-target"]

[package]
name = "kernel"
version.workspace = true
edition = "2024"
# Soft-float target, used when cargo builds this package directly (clippy, rust-analyzer).
# The booted kernel and `just test-integration` use the SSE target `x86_64-minecraft-os.json`,
# which needs build-std, and cargo panics combining build-std with `default-target`.
default-target = "x86_64-unknown-none"

[[bin]]
name = "kernel"
test = false
bench = false

[lib]
test = false
bench = false
doctest = false

[dependencies]
kernel-core = { path = "../kernel-core" }
x86_64.workspace = true
bootloader_api.workspace = true
log.workspace = true
spin.workspace = true
lazy_static.workspace = true
uart_16550.workspace = true
pic8259.workspace = true
pc-keyboard.workspace = true
linked_list_allocator.workspace = true
acpi.workspace = true
glam.workspace = true
heapless.workspace = true
